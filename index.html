<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Productivity Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AI Productivity Assistant</h1>
        <p>Smart AI tools for workplace productivity and automation.</p>
    </header>

    <section class="features">
<section id="email" class="email-generator">
       <div class="card" onclick="openFeature('email')">
    <h2>Smart Email Generator</h2>
    <p>Create professional emails instantly using AI.</p>
</div>
<section id="summarizer" class="summarizer" style="display:none;">
        <div class="card" onclick="openFeature('summarizer')">
            <p>Convert long meeting notes into short summaries.</p>
        </div>
<section id="planner" class="planner" style="display:none;">
       <div class="card" onclick="openFeature('planner')">
            <p>Organize tasks and improve productivity.</p>
        </div>
<section id="chatbot" class="chatbot" style="display:none;">
        <div class="card" onclick="openFeature('chatbot')">
            <p>Interact with an AI workplace assistant.</p>
        </div>

    </section>

</body>
</html>
